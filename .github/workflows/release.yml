name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds start clean; no cache that a PR could have seeded.
          cache: false
      - name: Resolve version
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag $tag" >&2; exit 2; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify release revision
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Build archives
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/build-release.sh
      - name: Checksums
        run: |
          cd dist && sha256sum -- * | sort -k2 > SHA256SUMS
          { echo '| Asset | Bytes |'; echo '| --- | ---: |'; for f in *; do echo "| $f | $(wc -c < "$f") |"; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets
        run: |
          for artifact in dist/*; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/* --title "Hootway ${TAG#v}" --notes-file RELEASE_NOTES.md --verify-tag "${prerelease[@]}"

  container:
    name: Release container
    # Publish the image only after the tagged revision passed verification.
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: the Dockerfile cross-compiles on $BUILDPLATFORM and the final
      # stage is scratch with no RUN steps.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          {
            echo "version=$version"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
            echo 'tags<<EOF'
            echo "ghcr.io/openhoo/hootway:${version}"
            if [[ "$version" != *-* ]]; then
              echo "ghcr.io/openhoo/hootway:${version%.*}"
              echo 'ghcr.io/openhoo/hootway:latest'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/openhoo/hootway@${DIGEST}"
      - name: Smoke test published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "ghcr.io/openhoo/hootway@${DIGEST}" version
          { echo '```'; docker buildx imagetools inspect "ghcr.io/openhoo/hootway@${DIGEST}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
